name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload runnable application and agent instructions
        uses: actions/upload-artifact@v4
        with:
          name: PixelForge-Windows-x64
          path: |
            build/Release/PixelForge.exe
            build/Release/agent_system_prompt.md